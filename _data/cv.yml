    Projects:
      - name: Open Vocabulary Navigation
        summary: Implemented a ROS2-based open-vocabulary navigation system for a robot in Gazebo using dense semantic mapping and CLIP-based visual grounding for goal point specification via natural language prompts.
        highlights:
          - Currently exploring methodologies for improving real-time navigation performance for dynamic environments like houses.
        url: https://github.com/manojbhatta/ov_nav

      - name: Autonomous Mobile Robot using ROS2
        summary: Developed an autonomous robot for navigation in campus premises using SLAM Toolbox and the Nav2 stack in ROS2, utilizing 3D LiDAR for localization and mapping, achieving average goal point position accuracy of about 0.35 m over a path length of about 25 m.
        highlights:
          - Tested the impact of various parameters on navigation performance and fine-tuned them using the Gazebo simulator.
          - Implemented low-level motor control and robot kinematics, encoder data acquisition, and UART communication using STM32.

      - name: 4-Bar Linkage Synthesizer
        summary: Developed a Python program to calculate the parameters of a four-bar linkage that can trace an arbitrary path specified by the user, based on the Circular Proximity Function (CPF) and a Differential Evolution optimization algorithm.
        highlights:
          - "Tools used: Python (NumPy, Matplotlib, SciPy)"

